[package]
name = "lumen-css"
version = "0.1.0"
edition = "2024"
description = "Parser CSS conforme à CSS Syntax Level 3, brique du navigateur Lumen"
repository = "https://github.com/HarpeLm/lumen"
license = "MIT OR Apache-2.0"
keywords = ["css", "parser", "tokenizer", "browser"]
categories = ["parser-implementations", "web-programming"]
# Données de test : utiles au développement, pas au paquet publié.
exclude = ["css-parsing-tests"]

[dependencies]

[dev-dependencies]
ego-tree = "0.11"
html-parseur = { path = "../html" }
scraper = "0.27.0"
serde_json = "1.0.151"
