# Lumen, un navigateur web : un workspace Cargo, une brique par crate.
[workspace]
members = ["css","html","style"]
resolver = "3"

# Les profils de compilation ne s'appliquent qu'à la racine du workspace.

# Comme release, mais avec les symboles de debug pour que le profileur
# puisse afficher les noms de fonctions.
[profile.profiling]
inherits = "release"
debug = true
