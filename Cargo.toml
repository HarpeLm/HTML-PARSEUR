[package]
name = "html-parseur"
version = "0.1.0"
edition = "2024"
description = "Tokenizer et parser HTML conformes à la spec WHATWG (100 % html5lib et WPT), en Rust, sans dépendance"
repository = "https://github.com/HarpeLm/HTML-PARSEUR"
readme = "README.md"
license = "MIT OR Apache-2.0"
# Données de test et profils : utiles au développement, pas au paquet publié.
exclude = ["html5lib-tests", "wpt-tests", "profiling"]
keywords = ["html", "parser", "tokenizer", "dom", "whatwg"]
categories = ["parser-implementations", "web-programming"]

[dependencies]

[dev-dependencies]
criterion = "0.8.2"
html5ever = "0.40.1"
serde_json = "1.0.151"
typed-arena = "2"

[[bench]]
name = "tokenize"
harness = false

# Comme release, mais avec les symboles de debug pour que le profileur
# puisse afficher les noms de fonctions.
[profile.profiling]
inherits = "release"
debug = true

[[bench]]
name = "parse"
harness = false
