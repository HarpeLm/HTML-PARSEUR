[package]
name = "lumen-style"
version = "0.1.0"
edition = "2024"
description = "Cascade CSS : le style calculé de chaque élément, brique du navigateur Lumen"
repository = "https://github.com/HarpeLm/lumen"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["css", "cascade", "style", "browser"]
categories = ["web-programming"]

[dependencies]
html-parseur = { path = "../html" }
lumen-css = { path = "../css" }

[dev-dependencies]
serde_json = "1.0.151"
